<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Vincent Weiler, Director of Photography</title>
<meta name="description" content="Gallery of film stills by Vincent Weiler, director of photography based in Paris — narrative, commercials and beauty.">
<link rel="canonical" href="https://www.vincentweiler.com/gallery/">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
@font-face{font-family:"Sriracha Display";src:url("/fonts/SrirachaDisplay-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Archivo Narrow";src:url("/fonts/ArchivoNarrow.woff") format("woff");font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Instrument Sans";src:url("/fonts/instrument-sans-latin-ext-wght-normal.woff2") format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+A720-A7FF}
:root{--pad:7.3vw;--grey:#9c9c9c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#030303;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{text-align:center;padding:14px var(--pad) 0}
.name{font-family:"Sriracha Display",cursive;font-weight:400;font-size:clamp(60px,8.1vw,117px);line-height:1}
.sub{font-family:"Archivo Narrow",sans-serif;font-size:clamp(16px,1.35vw,20px);margin-top:18px}
main{padding:0 var(--pad) 120px}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(4,1fr);padding:18px var(--pad) 16px;margin-top:10px}
nav button{font:inherit;background:none;border:none;cursor:pointer;color:#030303;font-size:clamp(16px,1.55vw,22px);transition:color .15s}
nav button:hover,nav button.on{color:var(--grey)}
.sec{font-size:clamp(20px,1.8vw,26px);text-align:center;margin:90px 0 0}
.sec:first-child{margin-top:60px}
section.p{margin-top:56px}main>section.p:first-child{margin-top:40px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:14px}
.ph h2{font-size:clamp(18px,1.55vw,22px);font-weight:700;white-space:nowrap}
.ph .cr{font-size:clamp(14px,1.45vw,21px);text-align:right}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row img{display:block;background:#f3f3f3}
.empty{color:var(--grey);padding:80px 0;text-align:center}
@media (max-width:760px){:root{--pad:14px}nav{gap:4px;padding:14px var(--pad)}nav button{font-size:15px}.ph{flex-direction:column;gap:2px}.ph .cr{text-align:left}.sec{margin-top:64px}}
</style>
</head>
<body>
<header class="top">
  <h1 class="name"><a href="/" style="color:inherit;text-decoration:none">Vincent Weiler</a></h1>
  <div class="sub"><a href="/" style="color:inherit;text-decoration:none">Director of photography</a></div>
</header>
<nav id="nav"><button data-s="all" class="on">All</button><button data-s="Narrative">Narrative</button><button data-s="Commercials">Commercials</button><button data-s="Beauty">Beauty</button></nav>
<main id="main"><div class="empty">Chargement…</div></main>
<script>
const GAP=6;let DATA=[],filter='all';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ORDER={};
function applyOrder(){DATA.forEach(g=>{const o=ORDER[g.slug];if(!o)return;const pos=Object.fromEntries(o.map((id,i)=>[id,i]));
  g.items.sort((a,b)=>(pos[a.id]??1e6)-(pos[b.id]??1e6))})}
fetch('photos.json').then(r=>r.json()).then(d=>{DATA=d;applyOrder();build();layout()}).catch(()=>{document.getElementById('main').innerHTML='<div class="empty">Impossible de charger les photos.</div>'});
function build(){
  let html='',cur=null;
  DATA.forEach((g,gi)=>{
    if(filter!=='all'&&g.section!==filter)return;
    html+=`<section class="p"><div class="ph"><h2>${esc(g.title)}</h2><span class="cr">${esc(g.credits)}</span></div><div class="rows" data-g="${gi}"></div></section>`;
  });
  document.getElementById('main').innerHTML=html;
}
// Justified rows: every photo keeps its exact aspect ratio, nothing is cropped.
function layout(){
  const W=document.querySelector('.rows')?.clientWidth;if(!W)return;
  const target=W<700?Math.max(120,W*0.42):Math.min(270,Math.max(180,W*0.165));
  document.querySelectorAll('.rows').forEach(box=>{
    const grp=DATA[box.dataset.g],items=grp.items;let html='',row=[],sum=0;
    const flush=last=>{
      const h=last?Math.min(target,(W-GAP*(row.length-1))/sum):(W-GAP*(row.length-1))/sum;
      html+='<div class="row">'+row.map(it=>`<img loading="lazy" decoding="async" src="${it.m}" width="${(h*it.w/it.h).toFixed(2)}" height="${h.toFixed(2)}" style="width:${(h*it.w/it.h).toFixed(2)}px;height:${h.toFixed(2)}px" alt="${esc(it.alt||(grp.title+" — "+grp.credits))}">`).join('')+'</div>';
      row=[];sum=0;
    };
    const flushSmall=()=>{const it=row[0];const h=Math.min(target*0.8,(W*0.42)/(it.w/it.h));
      html+=`<div class="row"><img loading="lazy" decoding="async" src="${it.m}" style="width:${(h*it.w/it.h).toFixed(2)}px;height:${h.toFixed(2)}px" alt="${esc(it.alt||(grp.title+" — "+grp.credits))}"></div>`;row=[];sum=0};
    if(grp.perRow&&W>=700){for(let i=0;i<items.length;i+=grp.perRow){items.slice(i,i+grp.perRow).forEach(it=>{row.push(it);sum+=it.w/it.h});flush(false)}box.innerHTML=html;return}
    items.forEach(it=>{if(it.small){if(row.length)flush(true);row.push(it);sum=it.w/it.h;flushSmall();return}row.push(it);sum+=it.w/it.h;if((W-GAP*(row.length-1))/sum<=target)flush(false)});
    if(row.length)flush(true);
    box.innerHTML=html;
  });
}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.s;
  [...document.querySelectorAll('nav button')].forEach(x=>x.classList.toggle('on',x===b));build();layout();
  const n=document.getElementById('nav');if(scrollY>n.offsetTop)scrollTo({top:n.offsetTop})};
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(layout,120)});
</script>
</body>
</html>
