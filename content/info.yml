text: |-
  I'm a director of photography based in Paris, working across commercials, beauty, fashion and narrative film.
  I studied at Central Saint Martins and the London Film School, and spent years as a camera assistant in London and New York. Fluent in French and English, I shoot on film and digital.
  Feel free to get in touch.
clients_title: "Selected clients"
